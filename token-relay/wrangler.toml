# Deploy: CLOUDFLARE_API_TOKEN=… CLOUDFLARE_ACCOUNT_ID=… npx wrangler deploy (from this folder).
# The secret is set once by the owner: npx wrangler secret put GOOGLE_CLIENT_SECRET
name = "orca-colab-token-relay"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
GOOGLE_CLIENT_ID = "744100990078-mbs5l25fle4cup2b3pphq8ovatdetvnn.apps.googleusercontent.com"

# Strict per-IP limit (RATE_RULES in src/index.mjs): one Durable Object per client IP, counts in memory.
# The Workers Free plan only offers SQLite-backed Durable Objects, hence new_sqlite_classes; no rows are written.
[[durable_objects.bindings]]
name = "IP_LIMITER"
class_name = "IpRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpRateLimiter"]

# No request logs or traces: the relay must not keep codes or tokens anywhere.
[observability]
enabled = false
